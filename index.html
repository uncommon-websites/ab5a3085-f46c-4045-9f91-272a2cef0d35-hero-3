<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delphi | The Platform for Human Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="m-0 p-0 w-full h-screen overflow-hidden bg-[#EAE8E1]">

    <!-- Main Hero Container -->
    <main class="relative w-full h-full">
        
        <!-- Background Image -->
        <img src="https://imolwncbqxugevwmleed.supabase.co/storage/v1/object/public/public-assets/hero-images/ab5a3085-f46c-4045-9f91-272a2cef0d35/hero-3-img-0-1769776568094.png" 
             alt="Delphi Digital Mind Background" 
             class="absolute inset-0 w-full h-full object-cover z-0 opacity-60">

        <!-- Navigation Bar -->
        <header class="absolute top-0 left-0 w-full flex justify-between items-start px-6 py-6 md:px-12 md:py-10 z-10">
            
            <!-- Left: Library -->
            <div class="flex-shrink-0">
                <a href="#" class="text-[11px] md:text-[13px] tracking-[0.2em] text-[#475569] uppercase font-medium hover:text-[#3b82f6] transition-colors">
                    Library of Minds
                </a>
            </div>

            <!-- Center: Name & Headline -->
            <div class="absolute left-1/2 top-6 md:top-10 transform -translate-x-1/2 w-full text-center pointer-events-none hidden md:block">
                <h1 class="text-[13px] tracking-[0.4em] text-[#3b82f6] uppercase font-normal ml-[0.4em]">
                    Delphi &nbsp; | &nbsp; Scale &nbsp; Your &nbsp; Mind
                </h1>
            </div>

            <!-- Right: CTA / Get Started -->
            <div class="flex-shrink-0">
                <button class="flex flex-col items-center justify-center gap-[6px] group cursor-pointer border-none bg-transparent p-0">
                    <!-- CTA Line -->
                    <span class="w-6 h-[1.5px] bg-[#3b82f6] group-hover:w-8 transition-all duration-300 ease-out"></span>
                    <!-- CTA Text -->
                    <span class="text-[9px] tracking-[0.25em] text-[#475569] uppercase font-bold group-hover:text-[#3b82f6] transition-colors">
                        Get Started
                    </span>
                </button>
            </div>
        </header>

        <!-- Bottom Left: Value Proposition -->
        <div class="absolute bottom-0 left-0 px-6 py-6 md:px-12 md:py-10 z-10 max-w-md">
            <a href="#" class="block text-[11px] md:text-[13px] tracking-[0.2em] text-[#475569] uppercase font-medium hover:text-[#3b82f6] transition-colors mb-2">
                Book a Demo
            </a>
            <p class="text-[9px] md:text-[10px] tracking-[0.15em] text-[#475569] uppercase opacity-80 leading-relaxed">
                The world's first conversational media platform for human intelligence.
            </p>
        </div>

    </main>

</body>
</html>
